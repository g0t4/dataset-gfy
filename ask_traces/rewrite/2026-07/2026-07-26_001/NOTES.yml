    I did not mention using `string split --max 1` ... but that is what I had in mind!
    FTR... I did mention `without rejoin`
rewrite_evals:
  - in this case I asked the model to rewrite a fish function to remove some unecessary bloat in path splitting on / to get first path component (category) vs rest...
    - original code split on all / => thus it had to rejoin with /
    - new code (what I wanted and did not describe though) was to use `string slit --max 1 '/'`
    - a perfect grade here should use `--max`
      use llm judge to flag if a model comes up with another novel "simplification"
    - FYI could change my rewrite prompt to include using `string split --max` to give a hint if we wanted to test if a model understands this approach
  - in this case one good way to evaluate might be to run the generated code?
    we can do an exact match check but there's some subjectivity involved
    probably best to ask llm to judge if the code does what it was originally designed to do
      after the executes test works?
